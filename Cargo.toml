[workspace]
members = [
    "crates/okc-core",
    "crates/okc-protocol",
    "crates/okc-app",
    "crates/okc-ai",
    "crates/okc",
    "crates/okc-legacy-v1",
    "crates/okc-legacy-v2",
    "crates/okc-legacy-protocol",
    "crates/vaultc",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dolgogae/okc"

[workspace.dependencies]
anyhow = "1"
atomicwrites = "=0.4.4"
axoupdater = { version = "=0.10.0", features = ["blocking"] }
caseless = "=0.2.2"
clap = { version = "4", features = ["derive"] }
crossterm = "=0.29.0"
comrak = { version = "0.48", default-features = false }
data-encoding = "2"
hex = "0.4"
ignore = "0.4"
rayon = "1"
ratatui = "=0.30.2"
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "=1.1.4", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "=0.1.25"
unicode-segmentation = "1"
ureq = { version = "=3.4.0", default-features = false, features = ["json", "platform-verifier", "rustls"] }
zip = { version = "4", default-features = false, features = ["deflate", "zstd"] }
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
